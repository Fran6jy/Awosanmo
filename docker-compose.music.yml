# JYMusic: the same image as Awosanmo, switched to the music frontend and
# pointed at a music library. No torrent port is published; the torrent
# engine idles with nothing to do.
services:
  jymusic:
    build:
      context: .
      # Prebuilt dists shipped from a faster machine; see Dockerfile.prebuilt.
      dockerfile: Dockerfile.prebuilt
    image: awosanmo:local
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      APP: music
      PORT: 4000
      DATA_DIR: /data
      DB_PATH: /data/awosanmo.sqlite
      MUSIC_DIR: /data/music
      MUSIC_ART_DIR: /data/music-art
      MUSIC_SCAN_INTERVAL_MINUTES: ${MUSIC_SCAN_INTERVAL_MINUTES:-30}
      CORS_ORIGIN: ${CORS_ORIGIN}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      TORRENT_PORT: 51413
      MEDIA_SCAN_INTERVAL_SECONDS: 3600
      # Keep the process small on a 1 GB host; the music workload is light.
      NODE_OPTIONS: --max-old-space-size=256
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - /var/lib/awosanmo:/data
    ulimits:
      nofile:
        soft: 8192
        hard: 8192
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 25s
      retries: 5
      start_period: 120s
